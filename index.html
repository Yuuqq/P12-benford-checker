<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P12 本福特定律前端检测仪</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="本福特定律前端检测仪。P12 本福特定律前端检测仪" />
  <meta property="og:title" content="P12 本福特定律检测仪" />
  <meta property="og:description" content="本福特定律检测仪 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P12-benford-checker/" />
</head>

<body>
  <main class="app">
    <header class="hero">
      <h1>本福特定律前端检测仪</h1>
      <p>本福特定律(Benford's Law)指出，在自然产生的数据集中，首位数字为 1 的概率约为 30.1%，而非均匀分布的 11.1%。这被广泛用于财务审计与数据打假检测。</p>
      <p class="note">⚠️ 偏离是异常信号，不等于造假结论。没有 CSV？点击下方“加载示范数据”体验。</p>
    </header>

    <section class="card controls">
      <input id="fileInput" type="file" accept=".csv,text/csv" aria-label="选择文件" />
      <div style="display:flex;gap:12px;margin-top:8px">
        <button id="analyzeBtn" type="button">📊 开始分析</button>
        <button id="demoBtn" type="button"
          style="background:#f59e0b;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer">📋
          加载示范数据</button>
      </div>
      <p id="status" aria-live="polite">状态: 等待文件</p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>分布对比</h2>
        <div id="chart" class="chart"></div>
      </article>
      <article class="card">
        <h2>偏离结果</h2>
        <p id="deviation">偏离度: -</p>
        <p id="risk">提示: -</p>
        <ul id="details"></ul>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" crossorigin="anonymous"></script>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav
    style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
    <a href="https://yuuqq.github.io/_codex/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P12</span>
  </nav>
</body>

</html>
